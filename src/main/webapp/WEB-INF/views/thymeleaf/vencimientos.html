<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kumo - Vencimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kumo-theme.css}">
</head>
<body class="p-3">
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 d-none d-md-block p-3 kumo-sidebar d-flex flex-column justify-content-between">
            <div>
                <h3 class="fw-bold px-3 my-3 text-white">KUMO</h3>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/gastos}"><i class="bi bi-receipt me-2"></i> Gastos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/tareas}"><i class="bi bi-check2-square me-2"></i> Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/tareas-repetitivas}"><i class="bi bi-arrow-repeat me-2"></i> Rotación</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/vencimientos}"><i class="bi bi-calendar-event me-2"></i> Vencimientos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/liquidacion}"><i class="bi bi-wallet2 me-2"></i> Liquidación</a></li>
                </ul>
            </div>
        </div>

        <div class="col-md-10 px-4">
            <div class="my-3">
                <h2 class="fw-bold mb-0">Calendario de vencimientos</h2>
                <p class="text-muted small">Servicios y compromisos del hogar, del más próximo al más lejano.</p>
            </div>

            <div class="kumo-card">
                <h5 class="fw-bold mb-3"><i class="bi bi-calendar-event me-2"></i>Próximos vencimientos</h5>

                <p th:if="${#lists.isEmpty(vencimientos)}" class="small text-muted mb-0">
                    No hay vencimientos próximos.
                </p>

                <table class="table align-middle small mb-0" th:unless="${#lists.isEmpty(vencimientos)}">
                    <thead>
                        <tr><th>Vencimiento</th><th>Fecha</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${vencimientos}">
                            <td class="fw-semibold" th:text="${v.titulo}">Luz</td>
                            <td th:text="${#temporals.format(v.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
