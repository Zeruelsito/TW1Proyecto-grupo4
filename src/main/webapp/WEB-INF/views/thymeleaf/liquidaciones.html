<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Liquidación</title>
</head>
<body>
<form th:action="@{/pagos/hogares/seleccionar}" method="post">
    <label for="hogarSelect">Hogar actual:</label>
    <select id="hogarSelect" name="hogarId" onchange="this.form.submit()">
        <option value="">Seleccione un hogar...</option>
        <!-- ¡Añadimos th:value="${h.id}" aquí! -->
        <option th:each="h : ${listaHogares}"
                th:value="${h.id}"
                th:text="${h.nombreHogar}"
                th:selected="${casa != null and h.id == casa.id}">
        </option>
    </select>
</form>

<div th:if="${casa != null}">
    <h1>Liquidación para: <span th:text="${casa.nombreHogar}">Nombre del Hogar</span></h1>
</div>

<h2>Transferencias Sugeridas</h2>

<div th:if="${transferencias == null or #lists.isEmpty(transferencias)}">
    <p>Seleccione un hogar o no hay deudas pendientes para este hogar.</p>
</div>

<table border="1" th:unless="${transferencias == null or #lists.isEmpty(transferencias)}">
    <thead>
    <tr>
        <th>Emisor (Debe pagar)</th>
        <th>Receptor (Debe recibir)</th>
        <th>Monto ($)</th>
        <th>Acción</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${transferencias}">
        <td th:text="${t.emisor}">Emisor</td>
        <td th:text="${t.receptor}">Receptor</td>
        <td th:text="${t.monto}">0.00</td>
        <td>
            <!-- El formulario va dentro de la celda td -->
            <form th:action="@{/pagos/procesar-liquidacion}" method="post" accept-charset="UTF-8">
                <input type="hidden" name="nombreHogar" th:value="${casa.nombreHogar}" />
                <input type="hidden" name="emisor" th:value="${t.emisor}" />
                <input type="hidden" name="receptor" th:value="${t.receptor}" />
                <input type="hidden" name="monto" th:value="${t.monto}" />
                <button type="submit" class="btn btn-sm btn-primary">Generar URL</button>
            </form>

            <div class="mt-3" th:if="${urlPago != null and !#strings.isEmpty(urlPago)}">
                <label for="urlGenerada" class="form-label">URL de Mercado Pago generada con éxito:</label>
                <textarea id="urlGenerada" class="form-control" rows="2" readonly th:text="${urlPago}"></textarea>

                <!-- Botón directo para abrir el Checkout de Sandbox en una pestaña nueva -->
                <div class="mt-2">
                    <a th:href="${urlPago}" target="_blank" class="btn btn-success" style="padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">
                        🚀 Ir a Pagar en Mercado Pago (Sandbox)
                    </a>
                </div>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/vista-formulario}">Volver a seleccionar otro hogar</a>
</body>
</html>
