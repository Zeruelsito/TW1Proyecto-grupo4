<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumo - Registro de Usuario</title>
    <!-- Bootstrap 5 CSS & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kumo-theme.css}">
    <style>
        /* Estilos decorativos de fondo dinámico intermedio */
        body.kumo-auth-bg {
            background-color: #f8f9fa;
            position: relative;
            overflow-x: hidden;
        }
        .bg-shape-1 {
            position: absolute;
            top: -8%;
            left: -8%;
            width: 420px;
            height: 420px;
            background: rgba(120, 235, 190, 0.42); /* Menta fresco */
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }
        .bg-shape-2 {
            position: absolute;
            bottom: -8%;
            right: -8%;
            width: 460px;
            height: 460px;
            background: rgba(255, 140, 175, 0.45); /* Rosa intermedio */
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }
        .bg-shape-3 {
            position: absolute;
            top: 42%;
            left: 12%;
            width: 310px;
            height: 310px;
            background: rgba(190, 145, 255, 0.38); /* Lavanda suave */
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 kumo-auth-bg p-3">

    <!-- Formas flotantes de fondo -->
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>

    <div class="container" style="max-width: 420px; z-index: 1;">
        <!-- Logo / Encabezado -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-dark display-5 mb-1 tracking-tight">KUMO</h1>
            <p class="text-muted fw-medium small">Sumate a la plataforma de gestión para tu hogar.</p>
        </div>

        <!-- Tarjeta de Registro -->
        <div class="kumo-card p-4 shadow-sm rounded-4 border-0 bg-white bg-opacity-80 backdrop-blur">
            <h4 class="fw-bold mb-3"><i class="bi bi-person-plus me-2 text-success"></i>Crear Cuenta</h4>

            <form th:action="@{/registrarme}" method="POST" th:object="${usuario}">
                <div class="mb-3">
                    <label for="nombre" class="form-label small fw-semibold">Nombre</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light rounded-start-3 border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input th:field="*{nombre}" id="nombre" type="text" class="form-control rounded-end-3 border-start-0" placeholder="Tu nombre" autocomplete="name" />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light rounded-start-3 border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input th:field="*{email}" id="email" type="email" class="form-control rounded-end-3 border-start-0" placeholder="tu@email.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light rounded-start-3 border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input th:field="*{password}" type="password" id="password" class="form-control rounded-end-3 border-start-0" placeholder="••••••••" required autocomplete="new-password" />
                    </div>
                </div>

                <!-- Banner de Error -->
                <div th:if="${error != null}" class="alert alert-danger rounded-3 small py-2 mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${error}">Error al registrarse</span>
                </div>

                <button id="btn-registrarme" class="btn btn-dark w-100 rounded-3 py-2 fw-semibold mt-2 shadow-sm" type="submit">
                    Completar Registro
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <span class="small text-muted">¿Ya tenés una cuenta?</span>
                <a th:href="@{/login}" class="small fw-semibold text-decoration-none ms-1 text-primary">Iniciar sesión</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
