<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error en el Pago</title>
</head>
<body>
<div class="container" style="padding: 20px; font-family: Arial, sans-serif;">
    <h2 style="color: #d9534f;">¡Hubo un problema al procesar el pago!</h2>

    <p>Lo sentimos, no pudimos generar la preferencia de pago en este momento.</p>

    <!-- Mostramos el Código HTTP del error -->
    <p><strong>Código de Estado:</strong> <span th:text="${statusCode}">500</span></p>

    <!-- Mostramos el detalle exacto que envió Mercado Pago -->
    <div style="background-color: #f8d7da; padding: 10px; border-radius: 5px;">
        <strong>Detalle técnico:</strong>
        <p th:text="${errorDetalle}">Mensaje de error por defecto</p>
    </div>

    <br>
    <a th:href="@{/spring/liquidacion}" style="text-decoration: none; background: #007bff; color: white; padding: 10px 15px; border-radius: 4px;">
        Volver a Liquidaciones
    </a>
</div>
</body>
</html>
