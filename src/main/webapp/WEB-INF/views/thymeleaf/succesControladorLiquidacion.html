<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumo - Pago Exitoso</title>

    <!-- Bootstrap 5 CSS & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kumo-theme.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 p-3">

<div class="container text-center">
    <div class="kumo-card p-5 mx-auto rounded-4 shadow-sm" style="max-width: 480px;">
        <!-- Icono de éxito -->
        <div class="mb-3">
            <div class="d-inline-flex align-items-center justify-content-center bg-white text-success rounded-circle p-3 shadow-sm" style="width: 72px; height: 72px;">
                <i class="bi bi-check-circle-fill fs-1"></i>
            </div>
        </div>

        <h3 class="fw-bold text-dark mb-2">¡Se realizó el pago!</h3>
        <p class="text-muted small mb-4">La pasarela simulada fue correcta y se realizó la transacción con éxito.</p>

        <!-- Alerta estilo KUMO en verde -->
        <div class="kumo-card bg-white text-success small py-3 px-3 rounded-3 mb-4 fw-semibold border-0 shadow-sm">
            <i class="bi bi-check-circle me-2"></i> ¡Transacción completada correctamente!
        </div>

        <!-- Botón manual para volver -->
        <a th:href="@{/liquidacion}" class="btn btn-dark rounded-3 fw-semibold px-4 py-2 w-100 shadow-sm">
            Volver a liquidaciones
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
